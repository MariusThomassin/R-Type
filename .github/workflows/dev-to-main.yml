name: Dev to Main Auto-Merge

on:
  push:
    branches:
      - dev
  workflow_dispatch:  # Manual trigger

jobs:
  build-multi-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    if: github.repository == 'MariusThomassin/R-Type'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27.0'
      
      - name: Setup build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev
      
      - name: Setup build environment (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install glfw
          cmake --version
      
      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
      
      - name: Build project
        id: build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --verbose
      
      - name: Build success message
        if: success()
        run: |
          echo "✅ Build successful on ${{ matrix.os }}!"
      
  merge-to-main:
    needs: build-multi-os
    runs-on: ubuntu-latest
    if: github.repository == 'MariusThomassin/R-Type'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Merge dev to main
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git fetch origin main
          git checkout main
          git merge --no-ff -X theirs origin/dev -m "Auto-merge dev to main after successful builds on all platforms"
          git push origin main
      
      - name: Success message
        if: success()
        run: |
          echo "✅ All builds passed on Linux, Windows and macOS! Dev successfully merged to main."
      
      - name: Failure message
        if: failure()
        run: |
          echo "❌ Merge failed! Dev NOT merged to main."
          exit 1
