name: Mirror to Epitech

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

jobs:
  mirror-to-epitech:
    runs-on: ubuntu-latest
    if: github.repository == 'MariusThomassin/R-Type'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Mirror to Epitech repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: git@github.com:EpitechPGE3-2025/G-CPP-500-MPL-5-2-rtype-1.git
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Success message
        if: success()
        run: |
          echo "✅ Mirror to Epitech successful!"
      
      - name: Failure message
        if: failure()
        run: |
          echo "❌ Mirror failed!"
          exit 1