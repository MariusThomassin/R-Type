name: PR Tests on Dev

on:
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev
      
      - name: Setup build environment (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Using pre-installed cmake: $(cmake --version)"
      
      - name: Setup build environment (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Using pre-installed cmake: $(cmake --version)"
      
      - name: Build project
        id: build
        run: |
          cmake -B build -S .
          cmake --build build --config Release
      
      - name: Success message
        if: success()
        run: |
          echo "✅ Build successful on ${{ matrix.os }}! PR ready to be merged."
      
      - name: Failure message
        if: failure()
        run: |
          echo "❌ Build failed on ${{ matrix.os }}! Please fix before merging."
          exit 1
